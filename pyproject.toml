[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "patternbench"
version = "0.1.0"
description = "Benchmark agentic patterns — naive, router, chain, self-check, ensemble — on a deterministic task set. No model, no API key."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ABU BAKAR SIDDIQUE" }]
keywords = ["agents", "patterns", "benchmark", "evaluation", "reasoning", "leaderboard", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
patternbench = "patternbench.cli:main"

[project.urls]
Homepage = "https://github.com/abubakarsiddique360/PatternBench"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 118
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501", "RUF001", "RUF002"]
